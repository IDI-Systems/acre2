# Arma server side: how the ACRE voice extension on your Arma server reaches the voice server.
# Put this file in the Arma server's folder as acre2_voice.toml (or point ACRE2_VOICE_CONFIG at
# it). Players never see it.

# Where this Arma server reaches the voice server.
address = "127.0.0.1:9987"

# The voice server's authority_secret (from acre2_voice_server.toml).
secret = "change me please"

# Optional: the voice server's certificate fingerprint (data/fingerprint.txt next to the voice
# server). Pinning it stops anyone impersonating the voice server to steal the secret.
# fingerprint = ""

# Optional: the address players connect to, if it differs from `address` (e.g. `address` is
# 127.0.0.1 because both run on one machine). Otherwise the voice server's public_address, else
# `address`, is used.
# client_address = "voice.example.com:9987"
