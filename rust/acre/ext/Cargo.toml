[package]
name = "acre2_ext"
description = "ACRE Arma 3 voice extension (acre_voice_x64): voice client and server authority"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "acre_voice"
crate-type = ["cdylib", "rlib"]

[dependencies]
acre2_dsp = { workspace = true, optional = true }
anyhow = { workspace = true }
acre2_voice_client = { workspace = true }
acre2_voice_codec = { workspace = true, optional = true }
acre2_voice_proto = { workspace = true }
acre2_voice_server = { workspace = true }
getrandom = { workspace = true }
arma-rs = { workspace = true }
base64 = { version = "0.22", optional = true }
postcard = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["client"]
# Player-side voice (audio devices). Dedicated Linux servers build without it, so the library
# doesn't need ALSA there.
client = ["acre2_voice_client/devices", "dep:acre2_dsp", "dep:acre2_voice_codec", "dep:base64"]

[lints]
workspace = true
