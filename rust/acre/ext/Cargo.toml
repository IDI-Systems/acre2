[package]
name = "acre2_ext"
description = "ACRE Arma 3 extension: voice client and server authority"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "acre"
crate-type = ["cdylib", "rlib"]

[dependencies]
acre2_dsp = { workspace = true }
acre2_voice_client = { workspace = true }
acre2_voice_codec = { workspace = true }
acre2_voice_proto = { workspace = true }
arma-rs = { workspace = true }
base64 = "0.22"
postcard = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
acre2_voice_server = { workspace = true }

[features]
default = ["client"]
# Player-side voice (audio devices). Dedicated Linux servers build without it, so the library
# doesn't need ALSA there.
client = ["acre2_voice_client/devices"]

[lints]
workspace = true
